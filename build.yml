name: Build MVP Client (.exe)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt pyinstaller
      - name: Compilar MVP.exe
        run: pyinstaller --noconsole --onefile --icon mvp.ico --add-data "logo.png;." --add-data "mvp.ico;." --collect-all customtkinter --name MVP MVP.py
      - uses: actions/upload-artifact@v4
        with:
          name: MVP-Client
          path: dist/MVP.exe
